<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Colegios · Higiene y Seguridad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F1EFEC; --card:#FFFFFF; --ink:#1F2328; --muted:#646B73; --line:#DEDAD4; --head:#24272C;
  --ver:#6E1E2E; --ver-soft:#F6E6E9;      /* para verificar: bordó */
  --ot:#1F6F78;  --ot-soft:#E1F0F1;       /* órdenes de trabajo: petróleo */
  --av:#C0632D;  --av-soft:#FAEBE1;       /* avances y comentarios: terracota */
  --ok:#2E7D4F;  --curso:#E0A27C; --nada:#D3D6DA;
  --btn:#FFFFFF; --soft:var(--soft); --line2:var(--line2); --headink:#FFFFFF; --amb:#B7791F; --amb-soft:#FBF0DC; --ok-soft:#E3F1E8; --tilefg:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif}
button{font:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ingreso */
#login{min-height:100vh;display:grid;place-items:center;background:var(--head);padding:16px}
#login form{background:var(--card);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
#login img{height:64px;margin-bottom:6px}
#login h1{margin:4px 0 2px;font-size:28px}
#login p{margin:0 0 18px;color:var(--muted)}
#login input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
#login label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;color:var(--muted);font-size:14px}
#login button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--ver);color:#fff;font-weight:600;font-size:16px}
#login .err{color:var(--ver);min-height:20px;margin-top:10px;font-size:14px}

/* encabezado */
header{background:var(--head);color:var(--headink);padding:14px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:42px;background:#fff;border-radius:6px;padding:3px 6px}
header h1{margin:0;font-size:26px;line-height:1}
header .sub{color:#B9BEC4;font-size:13px}
header .der{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#B9BEC4}
header button{background:#3A3E45;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600}

section{margin:22px 0}
h2{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2 small{font:500 13px Barlow,sans-serif;color:var(--muted)}

/* foco */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border-radius:14px;padding:16px 18px;color:var(--tilefg);display:flex;align-items:center;gap:14px;min-height:96px}
.tile .n{font:700 52px/1 "Barlow Condensed",sans-serif}
.tile .t{font-weight:600;font-size:17px;line-height:1.15}
.tile .t small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:3px}
.tile.ver{background:var(--ver)} .tile.ot{background:var(--ot)} .tile.av{background:var(--av)}
.tile.cero{opacity:.45}
.ranking{background:var(--card);border-radius:14px;margin-top:12px;padding:12px 16px}
.rk{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line2);cursor:pointer}
.rk:first-child{border-top:0}
.rk .nom{font-weight:600}
.rk .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line2)}
.rk .bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:22px}
.rk .tot{font:700 20px "Barlow Condensed",sans-serif;text-align:right}
.rk .tranqui{color:var(--muted);font-size:13px}

/* tarjetas de portales */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px 16px;color:#fff}
.card .top .logo{height:30px;max-width:170px;object-fit:contain}
.card .top .ini{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700}
.card .top .tx{flex:1;min-width:0}
.card .top h3{margin:0;font-size:22px;line-height:1}
.card .top .det{font-size:13px;opacity:.85}
.card .top .act{font-size:12px;background:rgba(0,0,0,.22);border-radius:20px;padding:4px 10px;white-space:nowrap}
.cont{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 4px}
.cnt{border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;border:2px solid transparent}
.cnt .n{font:700 38px/1 "Barlow Condensed",sans-serif}
.cnt .l{font-weight:600;font-size:14px;line-height:1.15}
.cnt .l small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.cnt.ver{background:var(--ver-soft);color:var(--ver)} .cnt.ot{background:var(--ot-soft);color:var(--ot)} .cnt.av{background:var(--av-soft);color:var(--av)}
.cnt.cero{opacity:.5}
.cnt.on{border-color:currentColor}
.prog{padding:10px 16px 4px}
.prog .tit{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.prog .tit b{color:var(--ink)}
.pbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--nada)}
.pbar span{height:100%}
.ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lista{margin:10px 16px 0;border-top:1px solid var(--line2)}
.it{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.it .st{border-radius:3px}
.it .l1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.it .l1 b{font-size:15px}
.it .tag{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.it .tit{font-weight:600;margin-top:2px}
.it .lug{font-size:13px;color:var(--muted)}
.it .txt{margin-top:5px;background:var(--soft);border-radius:8px;padding:7px 10px;font-size:14px;white-space:pre-wrap}
.it .pie{font-size:12.5px;color:var(--muted);margin-top:4px}
.nuevo{background:#111;color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;letter-spacing:.3px}
.vacio{color:var(--muted);padding:14px 0;font-size:14px}
.acc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 16px}
.acc a,.acc button{border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.acc a.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.acc .visto{margin-left:auto}
.acc .nota{font-size:12px;color:var(--muted);align-self:center}
.aviso{margin:12px 16px 0;background:#FFF4F0;border:1px solid #F0C9B8;color:#8A3B1A;border-radius:8px;padding:9px 12px;font-size:14px}
.cargando{padding:18px 16px;color:var(--muted)}

/* páginas y sin portal */
.pags{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.pag{background:var(--card);border-radius:12px;border-left:6px solid;overflow:hidden}
.pag .cab{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;border:0;background:none;text-align:left}
.pag .lg{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;flex:none}
.pag .lg img{max-width:38px;max-height:38px}
.pag b{display:block;font-size:16px}
.pag .cab span{font-size:13px;color:var(--muted)}
.pag .fl{margin-left:auto;font-size:18px;color:var(--muted)}
.pag .op{border-top:1px solid var(--line2);padding:4px 12px 10px}
.pag .o{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.pag .o:last-child{border-bottom:0}
.pag .o .t{flex:1 1 160px}
.pag .o .t small{display:block;color:var(--muted);font-size:12.5px}
.pag .o a,.pag .o button,.copiar{border:1px solid var(--line);background:var(--btn);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink)}
.copiar.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card);border:1px dashed #C8C3BC;border-radius:20px;padding:5px 12px;font-size:14px;color:var(--muted)}
.llego{display:inline-block;font:700 13px Barlow,sans-serif;background:#EEF0F2;color:#3B4148;border-radius:6px;padding:2px 8px;margin-bottom:5px}
.llego.viejo{background:var(--ver-soft);color:var(--ver)}
.mk{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px}
.mk.vi{background:#EEF0F2;color:#4A5058}.mk.tr{background:#E3F1E8;color:var(--ok)}
.bts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bts button{border:1px solid var(--line);background:var(--btn);border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600}
.bts button.tb{background:var(--ink);color:#fff;border-color:var(--ink)}
.bts button.res{background:var(--ok);color:#fff;border-color:var(--ok)}
.vacio a{color:var(--muted)}
.usr{margin:12px 16px 0;background:var(--soft);border-radius:10px;padding:10px 14px}
.usr h4{margin:2px 0 6px;font:600 17px "Barlow Condensed",sans-serif}
.ur{display:grid;grid-template-columns:1.2fr 1.3fr 1.5fr;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.ur:first-of-type{border-top:0}
.un b{display:block}.un small,.uc{display:block;font-size:12px;color:var(--muted)}
.ua{display:flex;flex-wrap:wrap;gap:5px}
code{font:600 13.5px ui-monospace,Consolas,monospace;background:var(--btn);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.clv{display:inline-flex;align-items:center;gap:4px}
.mini{border:0;background:none;padding:2px 4px;font-size:14px}
.clv .copiar,.un .copiar{padding:1px 6px;margin-left:4px}
.mini2{border:1px solid var(--line);background:var(--btn);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600}
.mini2.baja{color:var(--ver)}.mini2.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.alta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--line2)}
.alta input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:14px;width:160px}
.unota{font-size:12.5px;color:var(--muted);padding:6px 0 2px}
@media (max-width:640px){.ur{grid-template-columns:1fr}}
/* capacitaciones con videos */
.cap .top .chip{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center}
.cap .top .chip img{height:30px}
.cvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px 4px}
.cv{background:var(--soft);border-radius:10px;padding:10px 12px}
.cv .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px}
.cv .t span{font:700 20px "Barlow Condensed",sans-serif;white-space:nowrap}
.cv .bv{height:10px;border-radius:5px;background:var(--nada);margin-top:6px;overflow:hidden}
.cv .bv span{display:block;height:100%;background:var(--ok)}
.cres{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px 0;font-size:14px}
.cres b{font:700 20px "Barlow Condensed",sans-serif}
.cres .fil{margin-left:auto;display:flex;gap:4px}
.cres .fil button{border:1px solid var(--line);background:var(--btn);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600}
.cres .fil button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctab{width:calc(100% - 32px);margin:8px 16px 0;border-collapse:collapse;font-size:14px}
.ctab th{font:600 13px Barlow,sans-serif;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab td{padding:6px 4px;border-bottom:1px solid var(--line2);text-align:center}
.ctab .si{color:var(--ok);font-weight:700}
.ctab .si small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ctab .no{color:#B9BEC4}
.ctab tr.ok td:first-child::after{content:" ✓";color:var(--ok)}
footer{color:var(--muted);font-size:12.5px;padding:10px 0 30px}

@media (max-width:640px){
  .tiles{grid-template-columns:1fr}
  .tile{min-height:0;padding:12px 14px}.tile .n{font-size:40px}
  .grid{grid-template-columns:1fr}
  .cont{gap:8px}
  .cnt{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px}
  .cnt .n{font-size:32px}
  .cnt .l small{display:none}
  .card .top .tx{flex-basis:100%;order:3}
  .card .top .act{margin-left:auto}
  h2{flex-wrap:wrap;gap:2px 10px}
  .prog .tit{flex-wrap:wrap;gap:0 10px}
  .rk{grid-template-columns:96px 1fr 30px}
  header .der{margin-left:0}
}

/* ===== tablero 2 (9/11/2026): solapas, torre, bandeja, agenda, legajo, módulos, temas ===== */
header .tabs{display:flex;gap:4px;flex-wrap:wrap}
header .tabs a{color:var(--headink);opacity:.75;text-decoration:none;font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px}
header .tabs a.on{opacity:1;background:rgba(255,255,255,.14)}
header .tabs a:focus-visible{outline:2px solid var(--headink)}
header select{background:#3A3E45;color:#fff;border:0;border-radius:8px;padding:7px 8px;font:600 13px Barlow,sans-serif}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{border-radius:12px;padding:12px 14px;color:var(--tilefg);display:flex;gap:10px;align-items:center;border:0;text-align:left;cursor:pointer}
.kpi .n{font:700 40px/1 "Barlow Condensed",sans-serif}
.kpi .t{font-weight:600;font-size:14.5px;line-height:1.15}
.kpi.k1{background:var(--ver)} .kpi.k2{background:var(--ot)} .kpi.k3{background:var(--av)} .kpi.k4{background:var(--amb)}
.kpi.cero{opacity:.45}
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.filtros button,.filtros input{border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:20px;padding:5px 12px;font:600 13px Barlow,sans-serif}
.filtros button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filtros input{border-radius:8px;min-width:160px}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.mos{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px 10px 16px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.mos::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:12px 0 0 12px;background:var(--nada)}
.mos.r{background:var(--ver-soft);border-color:transparent}.mos.r::before{background:var(--ver)}
.mos.a{background:var(--amb-soft);border-color:transparent}.mos.a::before{background:var(--amb)}
.mos.g::before{background:var(--ok)}
.mos>b{font:600 16px "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mos .por{font-size:12.5px;color:var(--muted);min-height:16px}
.mos .sen{display:flex;gap:3px;height:6px;margin-top:3px}
.mos .sen i{flex:1;border-radius:3px;background:var(--nada)}
.mos .sen i.v{background:var(--ver)}.mos .sen i.o{background:var(--ot)}.mos .sen i.a{background:var(--av)}.mos .sen i.f{background:var(--amb)}.mos .sen i.g{background:var(--ok)}
.mos .et{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.et span,.chipc{font-size:11px;border-radius:9px;padding:1px 7px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.mos:focus-visible,.kpi:focus-visible{outline:2px solid var(--ot);outline-offset:2px}
.fila-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.colk{background:var(--soft);border-radius:12px;padding:10px;min-width:0}
.colk h3{margin:0 0 8px;font:600 17px "Barlow Condensed",sans-serif;display:flex;justify-content:space-between}
.tj{background:var(--card);border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--nada);padding:9px 10px;margin-bottom:8px;font-size:13.5px}
.tj.ver{border-left-color:var(--ver)}.tj.ot{border-left-color:var(--ot)}.tj.av{border-left-color:var(--av)}
.tj .c1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tj .cl{font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.tj .tt{font-weight:600;margin:3px 0 2px}
.tj .tx{white-space:pre-wrap;color:var(--ink);background:var(--soft);border-radius:6px;padding:5px 7px;margin-top:4px;max-height:7.5em;overflow:auto}
.tj .bts{margin-top:6px}
.vacio2{color:var(--muted);font-size:13px;padding:6px 2px}
.franja{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin-bottom:6px}
.franja div{height:30px;border-radius:5px;background:var(--soft);display:flex;align-items:flex-end;justify-content:center;font-size:10.5px;color:var(--muted);padding-bottom:2px;border:1px solid var(--line)}
.franja .h1{background:var(--ot-soft)}.franja .h2{background:color-mix(in srgb,var(--ot) 45%,var(--card))}.franja .h3{background:var(--ot);color:var(--tilefg)}
.franja .hv{box-shadow:inset 0 -4px 0 var(--ver)}
.ag{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:4px 14px;margin-bottom:12px}
.ag h3{margin:10px 0 4px;font:600 18px "Barlow Condensed",sans-serif;display:flex;gap:8px;align-items:baseline}
.ag h3 small{font:500 13px Barlow,sans-serif;color:var(--muted)}
.al{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2)}
.al .f{font:700 18px/1 "Barlow Condensed",sans-serif}
.al .f small{display:block;font:500 11.5px Barlow,sans-serif;color:var(--muted);margin-top:2px}
.al .d b{cursor:pointer}
.al .d .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.al .d span{display:block;font-size:13px}
.al .d small{display:block;font-size:12px;color:var(--muted)}
.cd{font:700 13px "Barlow Condensed",sans-serif;border-radius:12px;padding:3px 9px;white-space:nowrap}
.cd.r{background:var(--ver-soft);color:var(--ver)}.cd.a{background:var(--amb-soft);color:var(--amb)}.cd.g{background:var(--ok-soft);color:var(--ok)}
.tipo-ventana .d span{color:var(--ot)} .tipo-anual .d span,.tipo-bianual .d span{color:var(--ver);font-weight:600}
.leg-cab{border-radius:16px;padding:16px 18px;color:#fff;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:18px 0 0}
.leg-cab h2{margin:0;font-size:28px;color:#fff}
.leg-cab .sub2{font-size:13.5px;opacity:.9}
.leg-cab .der2{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.leg-cab a,.leg-cab button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:600 13.5px Barlow,sans-serif;text-decoration:none;cursor:pointer}
.sol{display:flex;gap:4px;margin:10px 0 14px;flex-wrap:wrap}

<body>
<div id="login">
  <form id="fl">
    <img src="logo_jea.png" alt="JEA">
    <h1>Colegios</h1>
    <p>Higiene y Seguridad · Lic. Marcelo Elvira</p>
    <input type="password" id="pw" placeholder="Clave" autocomplete="current-password" autofocus>
    <label><input type="checkbox" id="rec" checked> Recordar en este equipo</label>
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app" hidden></div>
<script>
const SAL = 'Btc7uXgibAe88AeB8WBWFg==', ITER = 310000;
const LS = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const LSset = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG = null, VIVO = {}, ABIERTO = {};

async function llave(clave) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256'}, k, 256);
}
async function abrir(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  for (const f of ['d.enc', 'p.enc']) {            // p.enc = usuario de prueba (sólo en la página de Lula)
    try {
      const r = await fetch(f, {cache: 'no-store'}); if (!r.ok) continue;
      const enc = new Uint8Array(await r.arrayBuffer());
      const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: enc.slice(0, 12)}, k, enc.slice(12));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) {}
  }
  throw new Error('clave');
}
document.getElementById('fl').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Abriendo…';
  try {
    CLAVE_ESCRITA = document.getElementById('pw').value;
    const raw = await llave(document.getElementById('pw').value);
    CFG = await abrir(raw);
    if (document.getElementById('rec').checked) LSset('lula_k', ub64(raw));
    iniciar();
  } catch (x) { err.textContent = 'La clave no es correcta.'; }
};
(async () => { const k = LS('lula_k'); if (!k) return; try { CFG = await abrir(b64(k)); iniciar(); } catch (e) { LSset('lula_k', null); } })();

/* ---------- datos vivos ---------- */
const VER = 'Listo para verificar', RES = 'Resuelto', DIA = 864e5;
const ES_MIO = q => /marcelo elvira|^prueba/i.test(q || '');   // lo que cargan el admin y el usuario «prueba» no cuenta como pendiente
const hace = ts => { const d = Math.floor((Date.now() - ts) / DIA); return d <= 0 ? 'hoy' : d === 1 ? 'hace 1 día' : `hace ${d} días`; };
function aFecha(f) { const [d, m, a] = String(f || '').split('/'); return a ? +new Date(+a, m - 1, +d, 12) : 0; }
function desdeEstado(r) {           // por si el script todavía no tiene la versión nueva
  const seg = [], ord = [];
  Object.entries(r.seguimiento || {}).forEach(([mes, pts]) => Object.entries(pts).forEach(([n, l]) => l.forEach((s, i) =>
    seg.push({id: `s|${mes}|${n}|${i}`, ts: aFecha(s.fecha), hora: s.fecha, mes, punto: n, estado: s.estado, quien: s.quien, texto: s.texto, fotos: (s.fotos || []).length}))));
  (r.ordenes || []).forEach(o => ord.push({...o, id: `o|${o.numero}|${o.fecha}`, ts: aFecha(o.fecha), hora: o.fecha}));
  return {seg, ord, marcas: {}, viejo: true};
}
function analizar(p, d) {
  const mesP = {}; p.meses.forEach(m => mesP[m.clave] = m);
  const M = d.marcas || {}, marca = id => (M[id] || {}).marca || '';
  const info = (mes, n) => (mesP[mes].puntos[n] || ['(punto ' + n + ')', '', '', '']);
  const verificar = [], avances = [], ots = [], porMes = {}, ultimo = {}; let ult = 0;
  d.seg.forEach(s => {
    if (!mesP[s.mes]) return;                                   // meses de prueba u otros
    if (s.ts > ult) ult = s.ts;
    const k = s.mes + '|' + s.punto; ultimo[k] = s;
    if (s.estado !== VER && s.estado !== RES && !ES_MIO(s.quien))
      avances.push({tipo: 'av', id: s.id, s, info: info(s.mes, s.punto), m: marca(s.id), mh: (M[s.id] || {}).hora});
  });
  Object.values(ultimo).forEach(s => {
    (porMes[s.mes] = porMes[s.mes] || {})[s.punto] = s.estado;
    if (s.estado === VER) verificar.push({tipo: 'ver', id: s.id, s, info: info(s.mes, s.punto), m: marca(s.id) === 'trabajado' ? 'visto' : marca(s.id), mh: (M[s.id] || {}).hora});
  });
  d.ord.forEach(o => {
    if (o.ts > ult) ult = o.ts;
    if (!o.borrada && !ES_MIO(o.quien)) ots.push({tipo: 'ot', id: o.id, o, m: marca(o.id), mh: (M[o.id] || {}).hora});
  });
  const t = i => (i.s || i.o).ts; [verificar, avances, ots].forEach(l => l.sort((a, b) => t(b) - t(a)));
  return {verificar, avances, ots, porMes, ultima: ult, total_ot: d.ord.filter(o => !o.borrada).length, viejo: !!d.viejo};
}
const pend = l => l.filter(i => i.m !== 'trabajado');
async function leer(p) {
  const q = `token=${encodeURIComponent(p.token)}&lic=${encodeURIComponent(p.lic || '')}`;
  try {
    let r = await (await fetch(`${p.api}?accion=tablero&${q}`, {cache: 'no-store'})).json();
    if (!r.ok) { r = await (await fetch(`${p.api}?accion=estado&${q}`, {cache: 'no-store'})).json(); if (!r.ok) throw 0; r = desdeEstado(r); }
    VIVO[p.id] = {d: r, a: analizar(p, r)};
  } catch (e) { VIVO[p.id] = {error: true}; }
}
async function actualizar() {
  document.getElementById('hora').textContent = 'Actualizando…';
  CFG.portales.forEach(p => VIVO[p.id] = VIVO[p.id] || {cargando: true});
  pintar();
  await Promise.all([...CFG.portales.map(leer), ...(CFG.capacitaciones || []).map(q => leerCap(q).then(pintarCap))]);
  document.getElementById('hora').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit'});
  pintar();
}
async function enviar(p, cuerpo) {
  const r = await (await fetch(p.api, {method: 'POST', headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({tipo: 'tablero', token: p.token, lic: p.lic || '', ...cuerpo})})).json();
  if (!r.ok) throw r; return r;
}
async function marcar(id, ids, marca) {
  const p = CFG.portales.find(q => q.id === id), x = VIVO[id];
  if (!x || !x.d || x.d.viejo) return;
  ids.forEach(k => x.d.marcas[k] = {marca, hora: 'recién'}); x.a = analizar(p, x.d); pintar();
  try { await enviar(p, {accion: 'marca', ids, marca}); } catch (e) { alertar(id, 'No se pudo guardar la marca. Tocá «Actualizar» y probá de nuevo.'); }
}
function todoVisto(id) {
  const a = VIVO[id].a; marcar(id, [...a.verificar, ...a.ots, ...a.avances].filter(i => !i.m).map(i => i.id), 'visto');
}
async function resolver(id, mes, punto, btn) {
  if (btn.dataset.ok !== '1') { btn.dataset.ok = '1'; btn.textContent = '¿Confirmás? Tocá de nuevo'; return; }
  const p = CFG.portales.find(q => q.id === id); btn.disabled = true; btn.textContent = 'Guardando…';
  try { await enviar(p, {accion: 'resolver', items: [{mes, punto, texto: 'Verificado'}]}); await leer(p); pintar(); }
  catch (e) { alertar(id, 'No se pudo marcar como resuelto.'); }
}
function alertar(id, t) { const c = document.getElementById('c_' + id); if (c) c.insertAdjacentHTML('afterbegin', `<div class="aviso">${esc(t)}</div>`); }

const BASE = 'https://marceloelvira-hys.github.io/';
let PAGAB = {};
function pintarPags() {
  document.getElementById('pags').innerHTML = CFG.paginas.map((g, k) => `
    <div class="pag" style="border-color:${g.color}">
      <button class="cab" onclick="PAGAB[${k}]=!PAGAB[${k}];pintarPags()">
        <div class="lg" style="background:${g.color}">${g.logo ? `<img src="${g.logo}" alt="">` : `<b style="color:#fff">${esc(g.cliente[0])}</b>`}</div>
        <div><b>${esc(g.cliente)}</b><span>${g.paginas.length} página${g.paginas.length > 1 ? 's' : ''}</span></div><span class="fl">${PAGAB[k] ? '▴' : '▾'}</span></button>
      ${PAGAB[k] ? `<div class="op">${g.paginas.map(x => `<div class="o"><div class="t">${esc(x.titulo)}<small>${esc(x.detalle || '')}</small></div>
        <a href="../${x.url}" target="_blank">Abrir ↗</a>${btnCopiar(BASE + x.url)}</div>`).join('')}</div>` : ''}
    </div>`).join('');
}
function btnCopiar(url, txt = '🔗 Copiar link para el cliente') { return `<button class="copiar" data-url="${esc(url)}" onclick="copiar(this)">${txt}</button>`; }
async function copiar(b) {
  const u = b.dataset.url;
  try { await navigator.clipboard.writeText(u); }
  catch (e) { const t = document.createElement('textarea'); t.value = u; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (x) {} t.remove(); }
  const txt = b.textContent; b.classList.add('ok'); b.textContent = '✓ Copiado'; setTimeout(() => { b.classList.remove('ok'); b.textContent = txt; }, 1800);
}

/* ---------- usuarios y claves ---------- */
let USR = {}, ALTA = {};
const clave = c => `<span class="clv"><code data-c="${esc(c)}">••••••</code><button class="mini" onclick="const e=this.previousElementSibling;e.textContent=e.textContent==='••••••'?e.dataset.c:'••••••'">👁</button>${btnCopiar(c, '📋')}</span>`;
function accesoTxt(p, u, cl) { return `Portal de Higiene y Seguridad de ${p.nombre}\n${BASE}${p.url.replace('../', '')}\n` + (u ? `Usuario: ${u}\n` : '') + `Clave: ${cl}`; }
function panelUsuarios(p, x) {
  const A = p.acceso, url = BASE + p.url.replace('../', '');
  if (A.tipo === 'compartida') return `<div class="usr"><h4>🔑 Acceso al portal</h4>
    <div class="ur"><div class="un"><b>Clave del portal</b><small>Una sola para todos los de ${esc(p.nombre)}</small></div>${clave(A.clave)}${btnCopiar(accesoTxt(p, '', A.clave), '📋 Copiar acceso para el cliente')}</div>
    <div class="ur"><div class="un"><b>Tu link de administrador</b><small>Entra directo como Lic. Marcelo Elvira</small></div>${btnCopiar(A.admin_link, '🔗 Copiar mi link')}</div>
    <div class="unota">Para cambiar la clave o pasar a usuarios por persona, pedímelo: hay que volver a cifrar el portal.</div></div>`;
  const vivo = x && x.d && x.d.cuentas, lista = vivo || A.usuarios.map(u => ({...u, propia: null}));
  const fila = u => {
    let c, acc = '';
    if (u.admin) c = `${clave(A.admin_clave)}<small class="uc">Tu clave (también la del tablero)</small>`;
    else if (u.propia === null) c = `<span class="uc">Inicial ${esc(u.inicial)} · no se sabe si ya la cambió</span>`;
    else if (u.propia && u.clave) c = `${clave(u.clave)}<small class="uc">La eligió ${esc(u.fecha)}</small>`;
    else if (u.propia) c = `<span class="uc">Ya eligió la suya (te llegó por mail)</span>`;
    else if (u.usuario === 'prueba') c = `<code>${esc(u.inicial)}</code><small class="uc">Usuario de prueba: clave fija, vista de cliente</small>`;
    else c = `<code>${esc(u.inicial)}</code><small class="uc">Inicial: la cambia al entrar</small>`;
    if (!u.admin) {
      acc += btnCopiar(accesoTxt(p, u.usuario, u.propia ? (u.clave || 'la que elegiste') : `${u.inicial} (la primera vez te pide elegir una nueva)`), '📋 Copiar acceso');
      if (vivo) acc += `<button class="mini2" onclick="opCuenta('${p.id}','resetear','${esc(u.usuario)}',this)">↺ Volver a ${esc(u.inicial || '123')}</button><button class="mini2 baja" onclick="opCuenta('${p.id}','baja','${esc(u.usuario)}',this)">✕ Dar de baja</button>`;
    }
    return `<div class="ur"><div class="un"><b>${esc(u.nombre)}</b><small>usuario: <code>${esc(u.usuario)}</code>${btnCopiar(u.usuario, '📋')}</small></div><div class="uv">${c}</div><div class="ua">${acc}</div></div>`;
  };
  return `<div class="usr"><h4>🔑 Usuarios y claves</h4>${lista.map(fila).join('')}
    ${A.soporte ? `<div class="ur"><div class="un"><b>Clave de soporte</b><small>Sólo vos: entra como cualquier usuario sin pedir cambio</small></div><div class="uv">${clave(A.soporte)}</div><div class="ua"></div></div>` : ''}

/* ----- Módulos: configuración efectiva ----- */
let CONFS = {}, CONF_OK = null, CAMBIOS = {};
const MODS = () => CFG.modulos.modulos;
const modDef = id => MODS().find(m => m.id === id);
function base(c) {
  const act = CFG.modulos.actuales[c.id];
  if (act) return act;
  const r = {}; ((CFG.modulos.plantillas[c.plantilla] || {}).modulos || []).forEach(m => r[m] = '*'); return r;
}
const confDe = id => CAMBIOS[id] || CONFS[id] || {m: {}, extra: [], nota: ''};
function modOn(c, mid) { const k = (confDe(c.id).m || {})[mid]; return k && typeof k.on === 'boolean' ? k.on : mid in base(c); }
function itemOn(c, mid, iid) {
  const k = ((confDe(c.id).m || {})[mid] || {}).it || {};
  if (iid in k) return k[iid];
  const b = base(c)[mid]; return b === '*' || !b ? true : b.includes(iid);
}
function hecho(c, mid, iid) { const a = (CFG.modulos.actuales[c.id] || {})[mid]; return !!a && (iid ? a === '*' || a.includes(iid) : true); }
function estadoMod(c, mid) {
  if (!modOn(c, mid)) return ['ap', 'Apagado'];
  if (!tienePortal(c)) return ['med', 'Se arma con el portal'];
  if (!hecho(c, mid)) return ['falta', 'Prendido · falta armarlo'];
  const m = modDef(mid), faltan = m.items.filter(([i]) => itemOn(c, mid, i) && !hecho(c, mid, i)).length;
  return faltan ? ['falta', `En el portal · ${faltan} ítem${faltan > 1 ? 's' : ''} por armar`] : ['en', 'En el portal'];
}
function tocar(cid, mid, iid, val) {
  const c = cli(cid), cf = JSON.parse(JSON.stringify(confDe(cid))); cf.m = cf.m || {};
  const k = cf.m[mid] = cf.m[mid] || {};
  if (iid) { k.it = k.it || {}; k.it[iid] = val; if (val && !modOn(c, mid)) k.on = true; }
  else k.on = val;
  CAMBIOS[cid] = cf; pintar();
}
async function leerConfs() {
  if (!CFG.config_api) { CONF_OK = false; return; }
  try { const r = await (await fetch(CFG.config_api + '?accion=todo', {cache: 'no-store'})).json(); if (!r.ok) throw 0; CONFS = r.confs || {}; CONF_OK = true; }
  catch (e) { CONF_OK = false; }
  if (VISTA === 'modulos' || (VISTA === 'legajo' && SOLAPA === 'modulos')) pintar();
}
async function tokenConf() {
  let t = LS('cfg_t'); if (t) return t;
  const pedir = clave => fetch(CFG.config_api, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({tipo: 'login', clave})}).then(r => r.json());
  if (CLAVE_ESCRITA) { const r = await pedir(CLAVE_ESCRITA); if (r.ok) { LSset('cfg_t', r.t); return r.t; } }
  return new Promise((ok, mal) => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = `<form><b>Confirmá tu clave de admin</b><p class="sub" style="color:var(--muted)">Una sola vez por equipo, para poder guardar módulos.</p><input type="password" id="cfg_pw" autocomplete="current-password"><div id="cfg_err" style="color:var(--ver);min-height:18px;font-size:13px"></div><button type="submit" style="background:var(--ok);color:#fff">Confirmar</button><button type="button" id="cfg_x">Cancelar</button></form>`;
    document.body.appendChild(d); d.querySelector('input').focus();
    d.querySelector('#cfg_x').onclick = () => { d.remove(); mal('cancelado'); };
    d.querySelector('form').onsubmit = async e => { e.preventDefault(); const r = await pedir(d.querySelector('input').value).catch(() => ({}));
      if (r.ok) { LSset('cfg_t', r.t); d.remove(); ok(r.t); } else d.querySelector('#cfg_err').textContent = r.error === 'bloqueado' ? 'Demasiados intentos: probá en 15 minutos.' : 'La clave no es correcta.'; };
  });
}
async function guardarConf(cid, btn) {
  const c = cli(cid), cf = CAMBIOS[cid]; if (!cf) return;
  if (!CONF_OK) { alert2('Todavía no está publicado el script «Portales · Configuración»: los cambios no se pueden guardar.'); return; }
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const t = await tokenConf();
    const nota = document.getElementById('cm_' + cid); const cambio = (nota && nota.value.trim()) || 'Cambio de módulos desde el tablero';
    let r = await (await fetch(CFG.config_api, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({tipo: 'guardar', t, cliente: cid, conf: cf, cambio})})).json();
    if (!r.ok && r.error === 'token') { LSset('cfg_t', null); throw 'token'; }
    if (!r.ok) throw r;
    CONFS[cid] = {...cf, _act: r.act}; delete CAMBIOS[cid]; pintar();
  } catch (e) { btn.disabled = false; btn.textContent = 'Guardar'; if (e !== 'cancelado') alert2('No se pudo guardar. Probá de nuevo; si sigue, avisame.'); }
}
function alert2(t) { const v = document.getElementById('vista'); v.insertAdjacentHTML('afterbegin', `<div class="aviso">${esc(t)}</div>`); window.scrollTo(0, 0); }
function medida(cid, k, val) {

/* ----- Módulos: orden de áreas y módulos (general y por cliente) ----- */
let MV = LS('tab_mv') || 'areas';
function ordenBaseDef() { const G = CFG.modulos.grupos; return {grupos: G.map(g => g.id), mods: Object.fromEntries(G.map(g => [g.id, MODS().filter(m => m.grupo === g.id).map(m => m.id)]))}; }
function completar(o, base) {
  const r = {grupos: (o && o.grupos || []).filter(g => base.grupos.includes(g)), mods: {}};
  base.grupos.forEach(g => { if (!r.grupos.includes(g)) r.grupos.push(g); });
  r.grupos.forEach(g => { const b = base.mods[g] || [], l = ((o && o.mods || {})[g] || []).filter(m => b.includes(m)); b.forEach(m => { if (!l.includes(m)) l.push(m); }); r.mods[g] = l; });
  return r;
}
const ordenGeneral = () => completar(confDe('_orden').orden, ordenBaseDef());
const ordenDe = cid => cid === '_orden' ? ordenGeneral() : completar(confDe(cid).orden, ordenGeneral());

function reordenar(scope, kind, a, b) {

  if (!CFG.config_api) return;
  let q = '';
  if (CFG.prueba) { NOTAS = []; return; }
  if (LECT()) q = 'l=' + encodeURIComponent(CFG.lula_t);
  else { let t = LS('cfg_t'); if (!t && CLAVE_ESCRITA) { try { t = await tokenConf(); } catch (e) {} } if (!t) return; q = 't=' + encodeURIComponent(t); }
  try { const r = await (await fetch(CFG.config_api + '?accion=notas&' + q, {cache: 'no-store'})).json(); if (r.ok) { NOTAS = r.notas || []; if (!LECT()) sincronizarAgenda(); pintar(); } } catch (e) {}
}
async function mandarNota(cid, btn) {
  const ta = document.getElementById('nt_' + cid), texto = ta.value.trim(); if (!texto) return;
  if (CFG.prueba) { NOTA_MSG[cid] = 'Estás con el usuario de prueba: las notas no se envían.'; pintar(); return; }
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await (await fetch(CFG.config_api, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({tipo: 'nota', l: CFG.lula_t, cliente: cid, nombre: (cli(cid) || {}).nombre || 'General', texto})})).json();
    if (!r.ok) throw r; NOTA_MSG[cid] = '✓ Enviada. Le llega a Marcelo por mail y al tablero.'; await leerNotas();
  } catch (e) { NOTA_MSG[cid] = 'No se pudo enviar. Probá de nuevo en un rato.'; pintar(); }
}
async function notaMarca(id, estado) {
  const n = (NOTAS || []).find(x => x.id === id); if (n) { n.estado = estado; n.marcado = 'recién'; pintar(); }
  try { const t = await tokenConf(); await fetch(CFG.config_api, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({tipo: 'nota-marca', t, id, estado})}); } catch (e) { alert2('No se pudo guardar la marca de la nota.'); }
}
const ESTN = {'': ['Recibida', 'a'], visto: ['Marcelo la vio', 'g'], trabajado: ['Resuelta', 'g']};
function listaNotas(cid) {
  const l = (NOTAS || []).filter(n => !cid || n.cliente === cid).slice().reverse();
  if (NOTAS === null) return '<div class="vacio2">Leyendo notas…</div>';
  if (!l.length) return '<div class="vacio2">Todavía no hay notas.</div>';
  return l.map(n => `<div class="nota"><div class="c1"><b>${esc((cli(n.cliente) || {nombre: 'General'}).nombre)}</b><span>${esc(n.fecha)}</span><span class="cd2 ${ESTN[n.estado] ? ESTN[n.estado][1] : 'a'}">${(ESTN[n.estado] || ESTN[''])[0]}</span></div><div class="tx">${esc(n.texto)}</div></div>`).join('');
}
function formNota(cid) {
  return `<div class="medida"><label for="nt_${cid}" class="k">Dejale una nota a Marcelo${cid ? ' sobre ' + esc((cli(cid) || {}).nombre || '') : ''}</label>
    <textarea id="nt_${cid}" placeholder="Ej.: llamaron del colegio para cambiar la fecha del simulacro…"></textarea>
    <div class="row"><button class="mini2 ok" onclick="mandarNota('${cid}',this)">✉ Enviar nota</button>${NOTA_MSG[cid] ? `<span class="sub3">${esc(NOTA_MSG[cid])}</span>` : ''}</div></div>`;
}
function vNotas() {
  return `<section><h2>Notas para Marcelo <small>lo que escribas le llega por mail y al tablero</small></h2>${formNota('')}<div style="margin-top:12px">${listaNotas('')}</div></section>`;
}
function modsLectura(c) {
  const O = ordenDe(c.id);
  const g = O.grupos.map(gid => { const ms = O.mods[gid].filter(m => modOn(c, m)); if (!ms.length) return '';
    return `<div class="mg"><h3><i style="background:${COLG[grupoDef(gid).color]}"></i>${esc(grupoDef(gid).nombre)}</h3><div class="et">${ms.map(m => `<span>${esc(modDef(m).nombre)}${tienePortal(c) && !hecho(c, m) ? ' · en preparación' : ''}</span>`).join('')}</div></div>`; }).join('');
  return g || '<div class="vacio2">Sin secciones definidas todavía.</div>';
}
function vLegajoLectura() {
  const c = cli(LEG), g = pagsDe(c), en = (CFG.enlaces || {})[c.id] || [], ag = agendaDe(c.id);
  const sol = (k, t) => `<button class="${SOLAPA === k ? 'on' : ''}" onclick="SOLAPA='${k}';pintar()">${t}</button>`;
  const nN = (NOTAS || []).filter(n => n.cliente === c.id).length;
  let cuerpo = '';
  if (SOLAPA === 'agenda') cuerpo = ag.length ? `<div class="ag2">${ag.map(agLinea).join('')}</div>` : '<div class="nop">No hay fechas de este colegio en el Control SAP.</div>';
  else if (SOLAPA === 'notas') cuerpo = formNota(c.id) + `<div style="margin-top:12px">${listaNotas(c.id)}</div>`;
  else {
    const links = [...(g ? g.paginas.map(x => ({titulo: x.titulo, detalle: x.detalle, url: x.url})) : []), ...en];
    cuerpo += links.length ? `<div class="pags"><div class="pag" style="border-color:${c.color}"><div class="cab"><div><b>Páginas del colegio</b><span>${links.length}</span></div></div><div class="op">${links.map(x => `<div class="o"><div class="t">${esc(x.titulo)}<small>${esc(x.detalle || '')}</small></div><a href="../${x.url}" target="_blank">Abrir ↗</a>${btnCopiar(BASE + x.url)}</div>`).join('')}</div></div></div>`
      : '<div class="nop"><h3>Todavía sin portal</h3><p style="margin:0">Marcelo lo va armando por orden; cuando esté, aparece acá.</p></div>';
    cuerpo += `<h2 style="margin-top:18px">Próximas fechas</h2>${ag.length ? `<div class="ag2">${ag.slice(0, 5).map(agLinea).join('')}</div>` : '<div class="vacio2">Sin fechas en el Control SAP.</div>'}`;
    cuerpo += `<h2 style="margin-top:18px">Qué tiene (o va a tener) su portal</h2>${modsLectura(c)}`;
  }
  return `<div class="leg-cab" style="background:${c.color}"><div><h2>${esc(c.nombre)}</h2><div class="sub2">${c.sedes.length > 1 ? c.sedes.map(s => esc(s.nombre)).join(' / ') : 'Colegio'}</div></div><div class="der2"><a href="#torre">← Colegios</a></div></div>
    <div class="sol">${sol('resumen', 'Resumen')}${sol('agenda', `Fechas (${ag.length})`)}${sol('notas', `Notas${nN ? ' (' + nN + ')' : ''}`)}</div>${cuerpo}`;
}
async function sincronizarAgenda() {
  if (!CFG.lula || !CFG.config_api) return;
  const ids = CFG.lula.ids, items = (CFG.agenda || []).filter(a => ids.includes(a.cliente) && diasA(a.fecha) >= 0 && diasA(a.fecha) <= 60)
    .map(a => ({fecha: a.fecha, nombre: (cli(a.cliente) || {}).nombre, sede: a.sede, titulo: a.titulo, hora: a.hora || ''}));
  const firma = CFG.hoy + '|' + items.length + '|' + (items[0] || {}).fecha;
  if (LS('ag_sync') === firma) return;
  try { const t = LS('cfg_t'); if (!t) return;
    const r = await (await fetch(CFG.config_api, {method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({tipo: 'agenda', t, items})})).json();
    if (r.ok) LSset('ag_sync', firma); } catch (e) {}
}
function tarjetaLula() {
  const L = CFG.lula; if (!L) return '';
  const txt = `Hola cuña! Esta es la página de los colegios para que veas todo:\n${L.url}\nClave: ${L.clave}\n(La primera vez marcá «Recordar en este equipo».)`;
  const pend = (NOTAS || []).filter(n => !n.estado).length;
  return `<section><h2>Página de Lula <small>colegios en modo lectura · ${L.ids.length} clientes</small></h2><div class="nop" style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center">
    <a class="mini2" href="../lula/" target="_blank">Abrir como la ve Lula ↗</a><span>Clave: ${clave(L.clave)}</span>${btnCopiar(txt, '📋 Copiar acceso para mandarle')}
    <span class="sub3">Usuario de prueba: clave «prueba» (ve lo mismo que Lula; sus notas no se envían)</span><span class="sub3">Notas: ${NOTAS === null ? 'tocá Bandeja para verlas' : pend ? `<b>${pend} nueva${pend > 1 ? 's' : ''}</b> en la Bandeja` : 'ninguna nueva'} · Resumen por mail los lunes 8 h a ${esc(L.mail)}</span></div></section>`;
}

/* ----- Legajo ----- */
function vLegajo() {
  const c = cli(LEG), p = portalDe(c.id), q = capDe(c.id), g = pagsDe(c), pl = CFG.modulos.plantillas[c.plantilla] || {};
  const url = p ? BASE + p.url.replace('../', '') : q ? BASE + q.url.replace('../', '') : g ? BASE + g.paginas[0].url : '';
  const sol = (k, t) => `<button class="${SOLAPA === k ? 'on' : ''}" onclick="SOLAPA='${k}';pintar()">${t}</button>`;
  const ag = agendaDe(c.id);
  let cuerpo = '';
  if (SOLAPA === 'modulos') cuerpo = editorModulos(c);
  else if (SOLAPA === 'agenda') cuerpo = ag.length ? `<div class="ag">${ag.map(a => { const n = diasA(a.fecha), d = fd(a.fecha); return `<div class="al tipo-${a.tipo}"><div class="f">${d.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'})}<small>${d.getFullYear()}</small></div><div class="d"><span>${esc(a.titulo)}${a.hora ? ' · ' + esc(a.hora) + ' h' : ''}${a.sede ? ' · ' + esc(a.sede) : ''}</span><small>${esc(a.exp)}${a.nota ? ' · ' + esc(a.nota) : ''}</small></div><span class="cd ${cdCl(n)}">${cdTxt(n)}</span></div>`; }).join('')}</div>` : '<div class="nop">No hay fechas de este cliente en el Control SAP.</div>';
  else {
    if (p) cuerpo += `<div class="grid">${tarjeta(p)}</div>`;
    if (q) cuerpo += `<div class="grid" id="cap"></div>`;
    if (g) cuerpo += `<div class="pags" style="margin-top:12px"><div class="pag" style="border-color:${g.color}"><div class="cab"><div class="lg" style="background:${g.color}">${g.logo ? `<img src="${g.logo}" alt="">` : `<b style="color:#fff">${esc(g.cliente[0])}</b>`}</div><div><b>Páginas</b><span>${g.paginas.length}</span></div></div><div class="op">${g.paginas.map(x => `<div class="o"><div class="t">${esc(x.titulo)}<small>${esc(x.detalle || '')}</small></div><a href="../${x.url}" target="_blank">Abrir ↗</a>${btnCopiar(BASE + x.url)}</div>`).join('')}</div></div></div>`;
    if (!tienePortal(c)) cuerpo += `<div class="nop"><h3>Todavía sin portal · ${c.prioridad}.º en la fila</h3><p style="margin:0 0 8px">Plantilla «${esc(pl.nombre || '')}». Va a tener: ${(pl.modulos || []).filter(m => modOn(c, m)).map(m => esc(modDef(m).nombre)).join(', ')}.</p><button class="mini2" onclick="SOLAPA='modulos';pintar()">Ajustar módulos antes de armarlo</button></div>`;
    if (ag.length) cuerpo += `<h2 style="margin-top:18px">Próximas fechas</h2><div class="ag">${ag.slice(0, 4).map(a => { const n = diasA(a.fecha), d = fd(a.fecha); return `<div class="al tipo-${a.tipo}"><div class="f">${d.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'})}<small>${d.getFullYear()}</small></div><div class="d"><span>${esc(a.titulo)}${a.hora ? ' · ' + esc(a.hora) + ' h' : ''}${a.sede ? ' · ' + esc(a.sede) : ''}</span></div><span class="cd ${cdCl(n)}">${cdTxt(n)}</span></div>`; }).join('')}</div>`;
  }
  return `<div class="leg-cab" style="background:${c.color}"><div><h2>${esc(c.nombre)}</h2><div class="sub2">${esc(pl.nombre || '')}${c.sedes.length > 1 ? ' · ' + c.sedes.map(s => esc(s.nombre)).join(' / ') : ''}${c.etiquetas.includes('lula') ? ' · cartera Lula' : ''}${c.etiquetas.includes('sforza') ? ' · con Franco' : ''}</div></div>
    <div class="der2"><a href="#torre">← Torre</a>${url ? `<a href="${esc(url)}" target="_blank">Abrir portal ↗</a><button onclick="copiar(this)" data-url="${esc(url)}">🔗 Copiar link</button>` : ''}</div></div>
    <div class="sol">${sol('resumen', 'Resumen')}${sol('modulos', 'Módulos')}${sol('agenda', `Agenda (${ag.length})`)}</div>${cuerpo}`;
}

let VERTRAB = {};
function tarjeta(p) {
  const x = VIVO[p.id] || {}, a = x.a, ab = ABIERTO[p.id];
  const top = `<div class="top" style="background:${p.color}">
      ${p.logo ? `<img class="logo" src="${p.logo}" alt="${esc(p.nombre)}">` : `<div class="ini">${esc(p.nombre[0])}</div>`}
      <div class="tx"><h3>${p.logo ? '' : esc(p.nombre)}</h3><div class="det">${esc(p.detalle)}</div></div>
      ${a && a.ultima ? `<div class="act">Último movimiento ${hace(a.ultima)}</div>` : ''}</div>`;
  const nuevos = a ? [...a.verificar, ...a.ots, ...a.avances].filter(i => !i.m).length : 0;
  const pie = `<div class="acc">
      <a class="pri" href="${p.admin_url}" target="_blank">Entrar como admin ↗</a>
      <a href="${p.url}" target="_blank">Ver como el cliente</a>
      ${btnCopiar(BASE + p.url.replace('../', ''))}
      <button onclick="USR['${p.id}']=!USR['${p.id}'];pintar()">🔑 Usuarios y claves</button>
      <span class="nota">${esc(p.admin_entrada)}</span>
      ${nuevos && !a.viejo ? `<button class="visto" onclick="todoVisto('${p.id}')">👁 Marcar todo como visto (${nuevos})</button>` : ''}</div>`;
  const pie2 = (USR[p.id] ? panelUsuarios(p, x) : '') + pie;
  if (x.cargando) return `<div class="card" id="c_${p.id}">${top}<div class="cargando">Leyendo la planilla…</div>${pie2}</div>`;
  if (x.error) return `<div class="card" id="c_${p.id}">${top}<div class="aviso">No se pudo leer la planilla del portal. Probá «Actualizar»; si sigue, avisame.</div>${pie2}</div>`;
  const cnt = (cl, l, n, nv) => `<button class="cnt ${cl}${n ? '' : ' cero'}${ab === cl ? ' on' : ''}" onclick="abrirLista('${p.id}','${cl}')"><span class="n">${n}</span><span class="l">${l}<small>${nv ? nv + ' sin ver' : n ? 'todo visto' : 'nada pendiente'}</small></span></button>`;
  const L = {ver: a.verificar, ot: a.ots, av: a.avances}, c3 = k => [pend(L[k]).length, L[k].filter(i => !i.m).length];
  const m = p.meses[0], est = a.porMes[m.clave] || {};
  const c = {ok: 0, ver: 0, curso: 0}; Object.values(est).forEach(e => { if (e === RES) c.ok++; else if (e === VER) c.ver++; else c.curso++; });
  const nada = m.n - c.ok - c.ver - c.curso, pc = n => (n / m.n * 100) + '%';
  const prog = `<div class="prog"><div class="tit"><span><b>Informe ${esc(m.clave)}</b> · ${m.n} puntos${m.visita ? ' · visita ' + esc(m.visita) : ''}</span><span><b>${c.ok}</b> resuelto${c.ok === 1 ? '' : 's'}</span></div>
      <div class="pbar"><span style="width:${pc(c.ok)};background:var(--ok)"></span><span style="width:${pc(c.ver)};background:var(--ver)"></span><span style="width:${pc(c.curso)};background:var(--curso)"></span></div>
      <div class="ley"><span><i style="background:var(--ok)"></i>Resueltos ${c.ok}</span><span><i style="background:var(--ver)"></i>Para verificar ${c.ver}</span><span><i style="background:var(--curso)"></i>Con avance ${c.curso}</span><span><i style="background:var(--nada)"></i>Sin movimiento ${nada}</span></div></div>`;
  return `<div class="card" id="c_${p.id}">${top}
    ${a.viejo ? '<div class="aviso">Falta publicar la versión nueva del script de este portal: por ahora se ve sin hora y sin marcas.</div>' : ''}
    <div class="cont">${cnt('ver', 'Para verificar', ...c3('ver'))}${cnt('ot', 'Órdenes de trabajo', ...c3('ot'))}${cnt('av', 'Avances y comentarios', ...c3('av'))}</div>
    ${prog}${ab ? lista(p, a, ab) : ''}${pie2}</div>`;
}
function abrirLista(id, cl) { ABIERTO[id] = ABIERTO[id] === cl ? null : cl; pintar(); }
function verTrab(id) { VERTRAB[id] = !VERTRAB[id]; pintar(); }
function lista(p, a, cl) {
  const todos = cl === 'ver' ? a.verificar : cl === 'ot' ? a.ots : a.avances;
  const items = VERTRAB[p.id] ? todos : pend(todos), ntrab = todos.length - pend(todos).length;
  const col = {ver: 'var(--ver)', ot: 'var(--ot)', av: 'var(--av)'}[cl];
  const pieL = cl !== 'ver' && ntrab ? `<div class="vacio"><a href="javascript:verTrab('${p.id}')">${VERTRAB[p.id] ? 'Ocultar' : 'Ver también'} los ${ntrab} ya trabajados</a></div>` : '';
  if (!items.length) return `<div class="lista"><div class="vacio">${cl === 'ver' ? 'No hay puntos esperando tu verificación.' : cl === 'ot' ? 'No hay órdenes de trabajo pendientes.' : 'No hay avances ni comentarios pendientes.'}</div>${pieL}</div>`;
  return `<div class="lista">${items.map(i => {
    const ts = (i.s || i.o).ts, viejo = Date.now() - ts > 7 * DIA;
    const llego = `<div class="llego${viejo ? ' viejo' : ''}">Llegó ${esc((i.s || i.o).hora)} · ${hace(ts)}</div>`;
    const estado = i.m === 'trabajado' ? `<span class="mk tr">✓ Trabajado ${esc(i.mh || '')}</span>` : i.m === 'visto' ? `<span class="mk vi">👁 Visto ${esc(i.mh || '')}</span>` : '<span class="nuevo">NUEVO</span>';
    const b = [];
    if (!a.viejo) {
      if (!i.m) b.push(`<button onclick="marcar('${p.id}',['${i.id}'],'visto')">👁 Visto</button>`);
      if (cl === 'ver') b.push(`<button class="res" onclick="resolver('${p.id}','${esc(i.s.mes)}','${esc(i.s.punto)}',this)">✓ Marcar resuelto</button>`);
      else if (i.m !== 'trabajado') b.push(`<button class="tb" onclick="marcar('${p.id}',['${i.id}'],'trabajado')">✓ Ya lo trabajé</button>`);
      else b.push(`<button onclick="marcar('${p.id}',['${i.id}'],'visto')">↺ Volver a pendiente</button>`);
    }
    const botones = b.length ? `<div class="bts">${b.join('')}</div>` : '';
    if (i.o) { const o = i.o; return `<div class="it"><div class="st" style="background:${col}"></div><div>${llego}
      <div class="l1"><b>${esc(o.numero)}</b><span class="tag" style="background:${col}">${esc(o.area || 'Sin área')}</span>${o.cargo ? `<span>a cargo de ${esc(o.cargo)}</span>` : ''}${estado}</div>
      <div class="lug">Informe ${esc(o.mes)} · puntos ${esc((o.puntos || []).join(', '))}</div>
      ${o.texto ? `<div class="txt">${esc(o.texto)}</div>` : ''}
      <div class="pie">${esc(o.quien)}</div>${botones}</div></div>`; }
    const s = i.s, f = s.fotos || 0;
    const tagc = s.estado === VER ? 'var(--ver)' : 'var(--av)';
    return `<div class="it"><div class="st" style="background:${col}"></div><div>${llego}
      <div class="l1"><b>Punto ${esc(s.punto)}</b><span class="lug">Informe ${esc(s.mes)}</span><span class="tag" style="background:${tagc}">${esc(s.estado)}</span>${estado}</div>
      <div class="tit">${esc(i.info[0])}</div><div class="lug">${esc(i.info[1])}${i.info[2] ? ' · ' + esc(i.info[2]) : ''}</div>
      ${s.texto ? `<div class="txt">${esc(s.texto)}</div>` : ''}
      <div class="pie">${esc(s.quien)}${f ? ` · 📷 ${f} foto${f > 1 ? 's' : ''} (en el portal y en tu mail)` : ''}</div>${botones}</div></div>`;
  }).join('')}${pieL}</div>`;
}
</script>
</body>
