<title>Consultas · Teque</title>
<style>
:root{--bordo:#6E1E2E;--bordo2:#7A2E3E;--bordo3:#A0525F;--rosa:#F3E3E6;--pet:#1F6F78;--petL:#DDEFF0;--terra:#C0632D;--verde:#3F7D4E;--verdeL:#E1F0E4;--violeta:#6B4E8C;--tinta:#2A2326;--gris:#7B7175;--linea:#E7DEE0;--fondo:#FAF7F6}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tinta);background:var(--fondo);overflow-x:clip}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:linear-gradient(120deg,var(--bordo),var(--bordo2) 55%,var(--bordo3));color:#fff;padding:14px 18px}
.top .f{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.top h1{margin:0;font-size:22px}.top p{margin:2px 0 0;opacity:.85;font-size:14px}
.top .yo{display:flex;gap:8px;align-items:center;font-size:14px}
.top .yo button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:7px 12px;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px}
.muted{color:var(--gris);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.b-bordo{background:var(--bordo);color:#fff}.b-pet{background:var(--pet);color:#fff}.b-verde{background:var(--verde);color:#fff}.b-suave{background:var(--rosa);color:var(--bordo)}.b-blanco{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.btn:disabled{opacity:.5}
textarea,input[type=text],input[type=password],select{border:1px solid var(--linea);border-radius:12px;padding:10px;width:100%;background:#fff;font-size:16px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:3px solid var(--pet);outline-offset:2px}
.guardado{font-size:12px;color:var(--verde);min-height:16px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{border-radius:16px;padding:13px;color:#fff;position:relative;overflow:hidden;cursor:pointer;border:3px solid transparent}
.kpi.on{border-color:var(--tinta)}
.kpi .n{font-size:32px;font-weight:800;line-height:1}.kpi .l{font-size:13px;opacity:.92;margin-top:4px}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.13)}
.nueva{padding:14px;margin-bottom:12px;border-left:6px solid var(--bordo)}
.nueva summary{font-weight:800;color:var(--bordo);cursor:pointer;font-size:16px}
.tipos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:12px 0}
.tipo{border:2px solid var(--linea);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-weight:700;font-size:13px}
.tipo .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin:0 auto 6px;color:#fff;font-size:20px}
.tipo.on{border-color:var(--tinta);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.ayuda{background:var(--fondo);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--gris);margin-bottom:8px}
.subir{display:flex;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--bordo3);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;color:var(--bordo);background:#fff;text-align:center;font-size:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.filtros button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.6fr);gap:12px;align-items:start}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--linea);cursor:pointer;align-items:flex-start}
.item:last-child{border-bottom:0}.item.sel{background:var(--rosa)}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px;flex:none}
.item h4{margin:2px 0 4px;font-size:15px;line-height:1.25}
.est{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.det{padding:16px}
.det h2{margin:2px 0 6px;font-size:21px;color:var(--bordo);line-height:1.2}
.pedido{background:var(--rosa);border-radius:14px;padding:12px;margin:10px 0;font-size:15px;line-height:1.45;white-space:pre-wrap}
.pedido .q{font-size:12px;font-weight:800;color:var(--bordo);margin-bottom:3px;white-space:normal}
.archivos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.arch{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px dashed var(--bordo3);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.arch.tq{border-color:var(--pet);background:var(--petL)}
.sec{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mat{border-radius:14px;border:1px solid var(--linea);overflow:hidden;background:#fff}
.matbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;background:var(--fondo);border-bottom:1px solid var(--linea)}
.cargando{padding:30px;text-align:center;color:var(--gris)}
.plano{position:relative;cursor:crosshair}
.plano img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);width:28px;height:28px;border-radius:50% 50% 50% 0;rotate:-45deg;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);pointer-events:none}
.pin span{rotate:45deg;color:#fff;font-weight:800;font-size:12px}
.pin.hl{outline:3px solid var(--tinta)}
.lienzo{position:relative}
.lienzo canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.lienzo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.55}
.col{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linea)}
.col.on{box-shadow:0 0 0 3px var(--tinta)}
.paginas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}
.pag{background:#fff;border:3px solid var(--linea);border-radius:8px;position:relative;cursor:pointer;overflow:visible}
.pag canvas{display:block;width:100%;height:auto;border-radius:5px}
.pag.on{border-color:var(--bordo)}
.pag b{position:absolute;bottom:4px;right:6px;font-size:12px;background:rgba(255,255,255,.9);border-radius:6px;padding:1px 6px}
.cnt{position:absolute;top:-9px;right:-9px;background:var(--bordo);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 7px}
.grande{padding:0 12px 12px}.grande canvas{width:100%;height:auto;border:1px solid var(--linea);border-radius:8px}
video{display:block;width:100%;background:#000;max-height:520px}
.linea{position:relative;height:22px;margin:8px 14px}
.linea .riel{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:var(--linea)}
.linea .mk{position:absolute;top:0;width:14px;height:22px;border-radius:5px;transform:translateX(-50%);cursor:pointer;border:2px solid #fff}
.resul{background:var(--verdeL);border-radius:12px;padding:10px;margin:10px}
.obsform{background:var(--fondo);border-radius:14px;padding:12px;margin-top:10px}
.ancla{display:inline-flex;gap:6px;align-items:center;font-weight:800;font-size:13px;background:#fff;border:2px solid var(--tinta);border-radius:999px;padding:4px 10px;margin-bottom:8px}
.clases{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.clases button{border:2px solid currentColor;background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;min-height:38px}
.clases button.on{color:#fff!important}
.obs{display:flex;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--linea);margin-bottom:8px;background:#fff;align-items:flex-start}
.obs.hecha{opacity:.55}.obs.hecha .tx{text-decoration:line-through}
.obs .lado{width:6px;align-self:stretch;border-radius:4px;flex:none}
.obs .tx{font-size:15px;line-height:1.4;white-space:pre-wrap}
.obs .an{cursor:pointer;font-weight:800;font-size:12px;border-radius:999px;padding:2px 8px;background:var(--fondo);border:1px solid var(--linea)}
.obs input[type=checkbox]{width:24px;height:24px;accent-color:var(--verde);flex:none;margin-top:2px}
.para{font-size:12px;font-weight:800;color:var(--pet)}
.msg{border-radius:14px;padding:10px 12px;max-width:92%;font-size:14.5px;line-height:1.4;margin-bottom:8px;white-space:pre-wrap}
.msg .q{font-size:11px;font-weight:800;opacity:.8;margin-bottom:2px}
.m-marcelo{background:var(--rosa)}.m-teque{background:var(--petL);margin-left:auto}
.cierre{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--linea)}
.tq .item h4{font-size:17px}.tq .obs .tx,.tq .pedido{font-size:17px}.tq .btn{min-height:50px;font-size:16px}
.entrada{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,var(--bordo),var(--bordo3) 60%,var(--pet))}
.login{background:#fff;border-radius:22px;padding:24px;width:min(380px,100%);text-align:center}
.login .logojea{display:block;width:min(220px,70%);height:auto;margin:0 auto 12px}
.login input{margin:6px 0}
.login label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;margin:6px 0 10px}
.err{color:var(--bordo);font-size:14px;min-height:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1}
.cola{background:var(--terra);color:#fff;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px;display:none}
.vacio{padding:40px 16px;text-align:center}
.visor{position:fixed;inset:0;background:rgba(42,35,38,.92);z-index:70;display:flex;flex-direction:column}
.visor .vb{display:flex;gap:8px;align-items:center;padding:8px 10px;color:#fff;flex-wrap:wrap}
.visor .vb b{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visor iframe,.visor img{flex:1;width:100%;border:0;background:#fff;object-fit:contain;min-height:0}
.arch .ab{font-weight:800;color:var(--pet);margin-left:4px}
.modo{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px}
.top .yo .modo button{background:none;padding:6px 10px}.top .yo .modo button.on{background:#fff;color:var(--bordo)}
.volver{display:none}
body.cel .wrap{padding:10px}
body.cel .top{padding:10px 12px}body.cel .top h1{font-size:19px}body.cel .top p{display:none}
body.cel .top .yo{width:100%;justify-content:space-between;flex-wrap:wrap;gap:6px}body.cel .top .yo>span{display:none}
body.cel .tipos{grid-template-columns:repeat(4,minmax(0,1fr))}
body.cel .grid{grid-template-columns:1fr}
body.cel .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}body.cel .kpi .n{font-size:28px}
body.cel .g3{grid-template-columns:1fr}
body.cel .paginas{grid-template-columns:repeat(2,minmax(0,1fr))}
body.cel .filtros{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}body.cel .filtros button{flex:none}
body.cel.abierto #lista,body.cel.abierto .kpis,body.cel.abierto .filtros,body.cel.abierto #dN{display:none}
body.cel:not(.abierto) #det{display:none}
body.cel .volver{display:inline-flex;margin-bottom:10px}
body.cel .det{padding:12px}body.cel .det h2{font-size:19px}
body.cel .item h4,body.cel .obs .tx,body.cel .pedido{font-size:17px}
body.cel .btn{min-height:50px;font-size:16px}
body.cel .cierre .btn{flex:1 1 100%}
body.cel .grande{padding:0 6px 6px}
body.leer #lista,body.leer .kpis,body.leer .filtros,body.leer #dN{display:none}
body.leer .grid{grid-template-columns:1fr}
body.leer .volver{display:inline-flex}
@media(min-width:1500px){body:not(.cel) .wrap,body:not(.cel) .top .f{max-width:min(1800px,96vw)}}
/* pantalla ancha */
body.leer:not(.cel) .pedido{max-height:4.4em;overflow:hidden;cursor:pointer;position:relative;margin:6px 0}
body.leer:not(.cel) .pedido.full{max-height:none}
.pedido .vt{display:none;font-weight:600;opacity:.7}body.leer:not(.cel) .pedido:not(.full) .vt{display:inline}
body.leer:not(.cel) .det>h2{font-size:24px;margin:4px 0 0}
body.leer:not(.cel) .volver{margin-bottom:6px}
/*  (PC, lectura de revision) */
body.leer:not(.cel) .wrap,body.leer:not(.cel) .top .f{max-width:min(1900px,98vw);padding-left:10px;padding-right:10px}
body.leer:not(.cel) .det{padding:10px}
body.leer:not(.cel) .inf{max-width:none;font-size:19.5px;line-height:1.6}
body.leer:not(.cel) .inf h1{font-size:38px;margin:20px 26px 6px}
body.leer:not(.cel) .isub{margin:0 26px 16px}
body.leer:not(.cel) .ikpis{grid-template-columns:repeat(4,minmax(0,1fr));margin:0 26px 16px}
body.leer:not(.cel) .isec{margin:26px 26px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));column-gap:28px;align-items:start}
body.leer:not(.cel) .isec>*{grid-column:1/-1}
body.leer:not(.cel) .isec>.blq:has(>.dato){grid-column:auto}
body.leer:not(.cel) .isec h2{font-size:23px}
body.leer:not(.cel) .isec .dato{display:block}body.leer:not(.cel) .isec .dato .lab{margin-bottom:2px}
body.leer:not(.cel) .inf figure img{width:auto;max-width:100%;max-height:74vh;margin:0 auto}
body.leer:not(.cel) .inf .figc{text-align:center}
body.leer:not(.cel) .ifirma{margin:34px 26px 0}
body.leer:not(.cel) .maq iframe{height:80vh}
.rtabs{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}
.rtabs button{border:0;border-radius:12px 12px 0 0;padding:12px 18px;font-weight:800;background:var(--fondo);color:var(--gris);font-size:15px}
.rtabs button.on{background:#1C262E;color:#fff}
.rpanel{border:2px solid #1C262E;border-radius:0 14px 14px 14px;overflow:hidden;background:#fff}
.inf{max-width:900px;margin:0 auto;padding:0 0 24px;font-size:16px;line-height:1.55}
.ihead{background:#1C262E;color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:5px solid #ED6D2B;flex-wrap:wrap}
.ihead img{height:40px}.ihead .lic{margin-left:auto;text-align:right;font-size:13px;color:#C9D2D8}.ihead .lic b{color:#fff;font-size:15px}
.inf h1{font-size:34px;margin:18px 18px 4px;line-height:1.1}
.isub{color:#5F6A73;margin:0 18px 14px}
.ikpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 18px 14px}
.ikpis div{background:#EDF0F2;border-top:4px solid;padding:8px 10px;border-radius:4px}.ikpis small{display:block;color:#5F6A73;font-size:11px;text-transform:uppercase}.ikpis b{font-size:15px}
.inf figure{margin:0}.inf figure img{width:100%;display:block;border-radius:6px}
.isec{margin:22px 18px 0}
.isec h2{font-size:20px;margin:0 0 10px;display:flex;gap:10px;align-items:center;border-bottom:2px solid #EDF0F2;padding-bottom:6px}
.isec h2 .num{background:#ED6D2B;color:#fff;border-radius:6px;min-width:34px;height:34px;display:grid;place-items:center;font-size:16px;flex:none}
.ac{color:#6E1E2E;font-weight:700;background:#F3E3E6;border-radius:3px;padding:0 3px}
.blq{position:relative;border-radius:10px;padding:6px 8px;margin:2px -8px 6px;border:2px solid transparent;transition:background .15s}
.blq:hover{background:#FAF6F3}
.blq.tiene{border-color:#F3D3C2}
.blq.editando{border-color:#C0632D;background:#FFF8F3}
.bx[contenteditable=true]{outline:none;background:#fff;border-radius:6px;padding:4px 6px;box-shadow:inset 0 0 0 2px #C0632D}
.bt{display:none;gap:6px;justify-content:flex-end;margin-top:4px}
.blq:hover .bt,.blq.activo .bt,.blq.editando .bt,.blq.tiene .bt{display:flex}
.bt button{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;min-height:34px}
.bt .e{color:#C0632D;border-color:#C0632D}.bt .c{color:var(--pet);border-color:var(--pet)}
.dato{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,2fr);gap:10px}.dato .lab{font-weight:700;color:#5F6A73}
.grp{font-weight:800;color:#2A3640;margin:10px 0 4px;text-transform:uppercase;font-size:13px}
.rec{display:flex;gap:12px}.rec .rn{font-size:30px;font-weight:900;color:#ED6D2B;line-height:1;min-width:30px}.rec .rt{font-weight:800}
.chipr{color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:4px;margin-left:6px;text-transform:uppercase}
.cart{display:flex;gap:10px;align-items:center}.cart img{width:40px;height:40px}.ub{color:#5F6A73;font-size:14px}
.figc{font-size:14px;color:#5F6A73;margin-top:4px}
.fotos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ifirma{display:flex;justify-content:space-around;margin:30px 18px 0;text-align:center;flex-wrap:wrap;gap:16px}.ifirma img{height:110px}
.iobs{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.io{border-radius:10px;padding:8px 10px;font-size:14.5px;border-left:5px solid;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06);display:flex;gap:8px;align-items:flex-start}
.io.hecha{opacity:.55}
.io .who{font-size:12px;font-weight:800;margin-bottom:2px}
.io input{width:22px;height:22px;accent-color:var(--verde);flex:none}
.diff del{background:#F7D9DD;color:#6E1E2E;text-decoration:line-through}.diff ins{background:#DDF0E0;color:#1F5A2E;text-decoration:none;font-weight:600}
.mini{background:var(--fondo);border-radius:10px;padding:8px;margin-top:6px}
.mini textarea{min-height:60px}
.mini .clases button{min-height:32px;padding:4px 10px}
.maq iframe{display:block;width:100%;height:72vh;border:0;background:#d9d6cf}
body.cel .maq iframe{height:62vh}
.maqbar{display:flex;gap:8px;align-items:center;padding:10px;background:#1C262E;color:#fff;flex-wrap:wrap}
.v3{display:flex;gap:10px;align-items:flex-start;border-radius:12px;border:1px solid var(--linea);padding:8px;margin:8px 10px;background:#fff}
.v3 img{width:150px;border-radius:8px;flex:none;background:#eee;min-height:84px}
.v3.hecha{opacity:.55}
body.cel .v3{flex-direction:column}body.cel .v3 img{width:100%}
body.cel .ikpis{grid-template-columns:repeat(2,minmax(0,1fr))}body.cel .dato{grid-template-columns:1fr;gap:0}body.cel .fotos{grid-template-columns:repeat(2,minmax(0,1fr))}body.cel .inf h1{font-size:26px}

@media(prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- API con cola (nada se pierde si falla la conexión) ---------- */
async function post(o){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});return r.json()}
function cola(){try{return JSON.parse(ls.get('cola')||'[]')}catch(e){return[]}}
function ponerCola(c){ls.set('cola',c.length?JSON.stringify(c):'');const e=$('#cola');if(e){e.style.display=c.length?'block':'none';e.textContent='⏳ '+c.length+' cambio(s) guardados en este equipo esperando conexión — se mandan solos.'}}
async function enviar(o,msgOk){
 o.token=TOKEN;const c=cola();
 try{const r=await post(o);if(r.error==='token'){salir();return null}if(r.error){toast('No se pudo: '+r.error);return null}if(msgOk)toast(msgOk);return r}
 catch(e){if(!o.archivos&&!o.archivo&&!o.base){c.push(o);ponerCola(c);toast('Sin conexión: quedó guardado y se manda solo')}else toast('Sin conexión: probá de nuevo (el borrador sigue guardado)');return null}}
async function vaciarCola(){let c=cola();if(!c.length)return;const quedan=[];for(const o of c){try{o.token=TOKEN;const r=await post(o);if(r.error==='token')quedan.push(o)}catch(e){quedan.push(o)}}ponerCola(quedan);if(quedan.length<c.length)await cargar()}

  '<div class="bt">'+(puedeEd?'<button class="e" data-ed="'+b.id+'">✏️ Corregir</button>':'')+'<button class="c" data-co="'+b.id+'">💬 Comentar</button></div>'+

function ioHTML(x,o){const col=CLASES[o.cl]?CLASES[o.cl][1]:'#7B7175';
 const cuerpo=o.cl==='edicion'&&o.orig!=null?'<div class="diff">'+diffHTML(o.orig,o.tx)+'</div>':'<div style="white-space:pre-wrap">'+esc(o.tx)+'</div>';
 return '<div class="io'+(o.h?' hecha':'')+'" style="border-color:'+col+'">'+(x.de===YO.u?'<input type="checkbox" data-hecha="'+o.id+'"'+(o.h?' checked':'')+' aria-label="Hecha">':'')+
  '<div style="flex:1"><div class="who" style="color:'+col+'">'+(o.cl==='edicion'?'✏️ '+NOMBRE[o.de]+' propone':'💬 '+NOMBRE[o.de]+' · '+(CLASES[o.cl]||['Nota'])[0])+' <span class="muted" style="font-weight:600">→ '+esc(o.para)+' · '+esc(fecha(o.f))+(o.h?' · hecha ✓':'')+'</span>'+
  (o.de===YO.u&&!o.h?' <button class="btn b-blanco" data-borra="'+o.id+'" style="min-height:26px;padding:1px 8px;font-size:12px">Borrar</button>':'')+'</div>'+cuerpo+'</div></div>'}
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function autoGuardador(x,keyId,armar,estado){let t=null,corre=false,otra=false;
 const run=async()=>{if(corre){otra=true;return}const obs=armar();if(!obs)return;corre=true;estado('Guardando…');const id=ls.get(keyId);if(id)obs.id=+id;
  try{const r=await post({accion:'obs',id:x.id,obs,token:TOKEN});if(r&&r.ok){if(r.id)ls.set(keyId,String(r.id));estado('✓ Guardado automáticamente '+hhmm())}else if(r&&r.error==='token'){salir()}else estado('No se pudo guardar en línea ('+(r&&r.error)+'): queda en este equipo')}
  catch(e){estado('Sin conexión: queda guardado en este equipo y se sube después')}corre=false;if(otra){otra=false;await run()}};
 const iv=setInterval(()=>{if(!document.body.contains(document.querySelector('#rpanel')))clearInterval(iv);else if(t===null)return;},30000);
 return{tocar:()=>{clearTimeout(t);t=setTimeout(()=>{t=null;run()},2500)},ya:async()=>{clearTimeout(t);t=null;await run()}}}
function engInf(x,D){
 $$('#rpanel .blq').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('button,input,textarea,[contenteditable=true]'))return;$$('#rpanel .blq.activo').forEach(z=>{if(z!==b)z.classList.remove('activo')});b.classList.add('activo')}));
 const hallar=id=>{for(const s of D.sec)for(const b of s.b)if(b.id===id)return b};

 $$('#rpanel [data-borra]').forEach(b=>b.onclick=async()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='¿Seguro? tocá de nuevo';return}x.notas=x.notas.filter(n=>n.id!==+b.dataset.borra);cargarRev(x);await enviar({accion:'borrarObs',id:x.id,obs:+b.dataset.borra},'Borrada');cargar(true)});
 $$('#rpanel [data-ed]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.ed,bl=btn.closest('.blq'),el=bl.querySelector('[data-bx="'+id+'"]'),orig=txtPlano(hallar(id).h);
  if(bl.classList.contains('editando'))return;bl.classList.add('editando');const k='ed'+x.id+id,kid='edid'+x.id+id,prev=ls.get(k);
  const mia=(x.notas||[]).filter(o=>o.an.t==='blq'&&o.an.b===id&&o.cl==='edicion'&&o.de===YO.u&&!o.h).pop();if(mia&&!ls.get(kid))ls.set(kid,String(mia.id));
  el.textContent=prev!=null?prev:(mia?mia.tx:orig);el.contentEditable='true';el.focus();
  const bar=document.createElement('div');bar.className='mini';bar.innerHTML='<div class="muted" style="margin-bottom:6px">Corregí el texto directamente arriba. Se guarda solo mientras escribís; Marce ve qué cambiaste.</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn b-pet" data-g>Guardar corrección</button><button class="btn b-blanco" data-x>Cancelar</button><span class="guardado"></span></div>';
  bl.querySelector('.bt').after(bar);const est=t=>{bar.querySelector('.guardado').textContent=t};
  const ag=autoGuardador(x,kid,()=>{const nuevo=el.innerText.replace(/\s+/g,' ').trim();if(!nuevo||(nuevo===orig&&!ls.get(kid)))return null;return{an:{t:'blq',b:id,l:bl.dataset.l},cl:'edicion',para:'Marce',tx:nuevo,orig}},est);
  el.oninput=()=>{ls.set(k,el.innerText);est('Escribiendo… se guarda solo');ag.tocar()};
  bar.querySelector('[data-g]').textContent='✓ Listo';
  bar.querySelector('[data-x]').textContent=ls.get(kid)?'Cerrar':'Cancelar';
  bar.querySelector('[data-x]').onclick=async()=>{if(ls.get(kid))await ag.ya();ls.set(k,'');ls.set(kid,'');await refrescarSinPintar();cargarRev(q(x.id))};
  bar.querySelector('[data-g]').onclick=async()=>{const nuevo=el.innerText.replace(/\s+/g,' ').trim();if((!nuevo||nuevo===orig)&&!ls.get(kid)){toast('No hay cambios');return}
   await ag.ya();ls.set(k,'');ls.set(kid,'');toast('Corrección guardada ✓');await refrescarSinPintar();cargarRev(q(x.id))}});
 $$('#rpanel [data-co]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.co,bl=btn.closest('.blq');if(bl.querySelector('.mini'))return;miniComentario(bl,'c'+x.id+id,async()=>{await refrescarSinPintar();cargarRev(q(x.id))},'',{x,kid:'cid'+x.id+id,armar:(tx,cl,para)=>({an:{t:'blq',b:id,l:bl.dataset.l},cl,para,tx})})});
}
function miniComentario(dentro,k,alGuardar,antes,auto){let cl='sugerencia';const f=document.createElement('div');f.className='mini';
 f.innerHTML=(antes||'')+'<div class="clases">'+['corregir','sugerencia','duda','ok'].map(c=>'<button data-c="'+c+'" style="color:'+CLASES[c][1]+'">'+CLASES[c][0]+'</button>').join('')+'</div><div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap"><span class="muted">Dirigido a</span><input type="text" list="paraL" value="'+esc(otro())+'" style="width:auto;max-width:200px" data-p></div><textarea placeholder="Escribí el comentario (o dictalo con el micrófono)…"></textarea><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn b-pet" data-g>Guardar comentario</button><button class="btn b-blanco" data-x>Cancelar</button><span class="guardado"></span></div>';
 const ta=f.querySelector('textarea');ta.value=ls.get(k)||'';const est=t=>{f.querySelector('.guardado').textContent=t};
 const ag=auto?autoGuardador(auto.x,auto.kid,()=>{const t=ta.value.trim();if(!t)return null;return auto.armar(t,cl,f.querySelector('[data-p]').value.trim()||otro(),!ls.get(auto.kid))},est):null;
 ta.oninput=()=>{ls.set(k,ta.value);if(ag){est('Escribiendo… se guarda solo');ag.tocar()}else est('Borrador guardado')};
 const pinta=()=>f.querySelectorAll('[data-c]').forEach(b=>{const on=b.dataset.c===cl;b.classList.toggle('on',on);b.style.background=on?CLASES[b.dataset.c][1]:'#fff'});pinta();
 f.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cl=b.dataset.c;pinta();if(ag&&ta.value.trim())ag.tocar()});
 f.querySelector('[data-x]').onclick=async()=>{if(ag&&ls.get(auto.kid)){await ag.ya();ls.set(k,'');ls.set(auto.kid,'');alGuardar(null,cl,'',f,true);return}ls.set(k,'');f.remove()};
 f.querySelector('[data-g]').onclick=async()=>{const t=ta.value.trim();if(!t){toast('Escribí el comentario');return}
  if(ag){f.querySelector('[data-g]').disabled=true;await ag.ya();ls.set(k,'');const ok=!!ls.get(auto.kid);ls.set(auto.kid,'');if(ok){toast('Comentario guardado ✓');alGuardar(t,cl,'',f,true)}else{f.querySelector('[data-g]').disabled=false;toast('No se pudo subir todavía: queda en este equipo')}return}
  ls.set(k,'');alGuardar(t,cl,f.querySelector('[data-p]').value.trim()||otro(),f)};
 const bt=dentro.querySelector('.bt');if(bt)bt.after(f);else dentro.appendChild(f);ta.focus();return f}

 if(SEL!==x.id||RT!=='maq')return;
 if(!MAQURL[a.id])MAQURL[a.id]=URL.createObjectURL(new Blob([c.bytes],{type:'text/html'}));

 p.innerHTML='<div class="maq"><div class="maqbar"><b style="flex:1">🧊 Maqueta del horno · girala, elegí la escena y comentá lo que ves</b><button class="btn b-bordo" id="com3d">💬 Comentar lo que se ve</button></div><iframe id="ifr3d" src="'+MAQURL[a.id]+'" allowfullscreen></iframe><div id="f3d"></div><div id="v3lista"></div></div>';pintarV3(x);
 $('#com3d').onclick=()=>{const ifr=$('#ifr3d');let est,img;try{const dd=ifr.contentDocument,cv=dd.getElementById('c');const md=(dd.querySelector('[data-mode].on')||{}).dataset||{},vw=(dd.querySelector('[data-view].on')||{});
