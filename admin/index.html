<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tablero de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F1EFEC; --card:#FFFFFF; --ink:#1F2328; --muted:#646B73; --line:#DEDAD4; --head:#24272C;
  --ver:#6E1E2E; --ver-soft:#F6E6E9;      /* para verificar: bordó */
  --ot:#1F6F78;  --ot-soft:#E1F0F1;       /* órdenes de trabajo: petróleo */
  --av:#C0632D;  --av-soft:#FAEBE1;       /* avances y comentarios: terracota */
  --ok:#2E7D4F;  --curso:#E0A27C; --nada:#D3D6DA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif}
button{font:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ingreso */
#login{min-height:100vh;display:grid;place-items:center;background:var(--head);padding:16px}
#login form{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
#login img{height:64px;margin-bottom:6px}
#login h1{margin:4px 0 2px;font-size:28px}
#login p{margin:0 0 18px;color:var(--muted)}
#login input[type=password]{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
#login label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;color:var(--muted);font-size:14px}
#login button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--ver);color:#fff;font-weight:600;font-size:16px}
#login .err{color:var(--ver);min-height:20px;margin-top:10px;font-size:14px}

/* encabezado */
header{background:var(--head);color:#fff;padding:14px 0}
header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:42px;background:#fff;border-radius:6px;padding:3px 6px}
header h1{margin:0;font-size:26px;line-height:1}
header .sub{color:#B9BEC4;font-size:13px}
header .der{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#B9BEC4}
header button{background:#3A3E45;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600}

section{margin:22px 0}
h2{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h2 small{font:500 13px Barlow,sans-serif;color:var(--muted)}

/* foco */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border-radius:14px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;min-height:96px}
.tile .n{font:700 52px/1 "Barlow Condensed",sans-serif}
.tile .t{font-weight:600;font-size:17px;line-height:1.15}
.tile .t small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:3px}
.tile.ver{background:var(--ver)} .tile.ot{background:var(--ot)} .tile.av{background:var(--av)}
.tile.cero{opacity:.45}
.ranking{background:var(--card);border-radius:14px;margin-top:12px;padding:12px 16px}
.rk{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:12px;padding:7px 0;border-top:1px solid #EFECE8;cursor:pointer}
.rk:first-child{border-top:0}
.rk .nom{font-weight:600}
.rk .bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:#F3F1EE}
.rk .bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;min-width:22px}
.rk .tot{font:700 20px "Barlow Condensed",sans-serif;text-align:right}
.rk .tranqui{color:var(--muted);font-size:13px}

/* tarjetas de portales */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card .top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px 16px;color:#fff}
.card .top .logo{height:30px;max-width:170px;object-fit:contain}
.card .top .ini{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700}
.card .top .tx{flex:1;min-width:0}
.card .top h3{margin:0;font-size:22px;line-height:1}
.card .top .det{font-size:13px;opacity:.85}
.card .top .act{font-size:12px;background:rgba(0,0,0,.22);border-radius:20px;padding:4px 10px;white-space:nowrap}
.cont{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 4px}
.cnt{border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;border:2px solid transparent}
.cnt .n{font:700 38px/1 "Barlow Condensed",sans-serif}
.cnt .l{font-weight:600;font-size:14px;line-height:1.15}
.cnt .l small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.cnt.ver{background:var(--ver-soft);color:var(--ver)} .cnt.ot{background:var(--ot-soft);color:var(--ot)} .cnt.av{background:var(--av-soft);color:var(--av)}
.cnt.cero{opacity:.5}
.cnt.on{border-color:currentColor}
.prog{padding:10px 16px 4px}
.prog .tit{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.prog .tit b{color:var(--ink)}
.pbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--nada)}
.pbar span{height:100%}
.ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lista{margin:10px 16px 0;border-top:1px solid #EFECE8}
.it{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #EFECE8}
.it .st{border-radius:3px}
.it .l1{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.it .l1 b{font-size:15px}
.it .tag{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.it .tit{font-weight:600;margin-top:2px}
.it .lug{font-size:13px;color:var(--muted)}
.it .txt{margin-top:5px;background:#F7F5F2;border-radius:8px;padding:7px 10px;font-size:14px;white-space:pre-wrap}
.it .pie{font-size:12.5px;color:var(--muted);margin-top:4px}
.nuevo{background:#111;color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;letter-spacing:.3px}
.vacio{color:var(--muted);padding:14px 0;font-size:14px}
.acc{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 16px}
.acc a,.acc button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.acc a.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.acc .visto{margin-left:auto}
.acc .nota{font-size:12px;color:var(--muted);align-self:center}
.aviso{margin:12px 16px 0;background:#FFF4F0;border:1px solid #F0C9B8;color:#8A3B1A;border-radius:8px;padding:9px 12px;font-size:14px}
.cargando{padding:18px 16px;color:var(--muted)}

/* páginas y sin portal */
.pags{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.pag{background:var(--card);border-radius:12px;border-left:6px solid;overflow:hidden}
.pag .cab{display:flex;align-items:center;gap:12px;padding:10px 12px;width:100%;border:0;background:none;text-align:left}
.pag .lg{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;flex:none}
.pag .lg img{max-width:38px;max-height:38px}
.pag b{display:block;font-size:16px}
.pag .cab span{font-size:13px;color:var(--muted)}
.pag .fl{margin-left:auto;font-size:18px;color:var(--muted)}
.pag .op{border-top:1px solid #EFECE8;padding:4px 12px 10px}
.pag .o{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 0;border-bottom:1px solid #F3F1EE}
.pag .o:last-child{border-bottom:0}
.pag .o .t{flex:1 1 160px}
.pag .o .t small{display:block;color:var(--muted);font-size:12.5px}
.pag .o a,.pag .o button,.copiar{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink)}
.copiar.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:var(--card);border:1px dashed #C8C3BC;border-radius:20px;padding:5px 12px;font-size:14px;color:var(--muted)}
.llego{display:inline-block;font:700 13px Barlow,sans-serif;background:#EEF0F2;color:#3B4148;border-radius:6px;padding:2px 8px;margin-bottom:5px}
.llego.viejo{background:var(--ver-soft);color:var(--ver)}
.mk{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px}
.mk.vi{background:#EEF0F2;color:#4A5058}.mk.tr{background:#E3F1E8;color:var(--ok)}
.bts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bts button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:13px;font-weight:600}
.bts button.tb{background:var(--ink);color:#fff;border-color:var(--ink)}
.bts button.res{background:var(--ok);color:#fff;border-color:var(--ok)}
.vacio a{color:var(--muted)}
.usr{margin:12px 16px 0;background:#F7F5F2;border-radius:10px;padding:10px 14px}
.usr h4{margin:2px 0 6px;font:600 17px "Barlow Condensed",sans-serif}
.ur{display:grid;grid-template-columns:1.2fr 1.3fr 1.5fr;gap:6px 12px;align-items:center;padding:8px 0;border-top:1px solid #E6E2DC}
.ur:first-of-type{border-top:0}
.un b{display:block}.un small,.uc{display:block;font-size:12px;color:var(--muted)}
.ua{display:flex;flex-wrap:wrap;gap:5px}
code{font:600 13.5px ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.clv{display:inline-flex;align-items:center;gap:4px}
.mini{border:0;background:none;padding:2px 4px;font-size:14px}
.clv .copiar,.un .copiar{padding:1px 6px;margin-left:4px}
.mini2{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600}
.mini2.baja{color:var(--ver)}.mini2.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.alta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0 4px;border-top:1px solid #E6E2DC}
.alta input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:14px;width:160px}
.unota{font-size:12.5px;color:var(--muted);padding:6px 0 2px}
@media (max-width:640px){.ur{grid-template-columns:1fr}}
/* capacitaciones con videos */
.cap .top .chip{background:#fff;border-radius:8px;padding:3px 8px;display:flex;align-items:center}
.cap .top .chip img{height:30px}
.cvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px 4px}
.cv{background:#F7F5F2;border-radius:10px;padding:10px 12px}
.cv .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:14px}
.cv .t span{font:700 20px "Barlow Condensed",sans-serif;white-space:nowrap}
.cv .bv{height:10px;border-radius:5px;background:#E3DFD9;margin-top:6px;overflow:hidden}
.cv .bv span{display:block;height:100%;background:var(--ok)}
.cres{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px 0;font-size:14px}
.cres b{font:700 20px "Barlow Condensed",sans-serif}
.cres .fil{margin-left:auto;display:flex;gap:4px}
.cres .fil button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600}
.cres .fil button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctab{width:calc(100% - 32px);margin:8px 16px 0;border-collapse:collapse;font-size:14px}
.ctab th{font:600 13px Barlow,sans-serif;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab td{padding:6px 4px;border-bottom:1px solid #F3F1EE;text-align:center}
.ctab .si{color:var(--ok);font-weight:700}
.ctab .si small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.ctab .no{color:#B9BEC4}
.ctab tr.ok td:first-child::after{content:" ✓";color:var(--ok)}
footer{color:var(--muted);font-size:12.5px;padding:10px 0 30px}

@media (max-width:640px){
  .tiles{grid-template-columns:1fr}
  .tile{min-height:0;padding:12px 14px}.tile .n{font-size:40px}
  .grid{grid-template-columns:1fr}
  .cont{gap:8px}
  .cnt{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 10px}
  .cnt .n{font-size:32px}
  .cnt .l small{display:none}
  .card .top .tx{flex-basis:100%;order:3}
  .card .top .act{margin-left:auto}
  h2{flex-wrap:wrap;gap:2px 10px}
  .prog .tit{flex-wrap:wrap;gap:0 10px}
  .rk{grid-template-columns:96px 1fr 30px}
  header .der{margin-left:0}
}
</style>
</head>
<body>
<div id="login">
  <form id="fl">
    <img src="logo_jea.png" alt="JEA">
    <h1>Tablero de clientes</h1>
    <p>Lic. Marcelo Elvira · uso interno</p>
    <input type="password" id="pw" placeholder="Clave" autocomplete="current-password" autofocus>
    <label><input type="checkbox" id="rec" checked> Recordar en este equipo</label>
    <button type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div id="app" hidden></div>
<script>
const SAL = 'q3mVt0rJb1cZ8kq2yW4n6A==', ITER = 310000;
const LS = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const LSset = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let CFG = null, VIVO = {}, ABIERTO = {};

async function llave(clave) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave.trim().toLowerCase()), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(SAL), iterations: ITER, hash: 'SHA-256'}, k, 256);
}
async function abrir(raw) {
  const enc = new Uint8Array(await (await fetch('d.enc', {cache: 'no-store'})).arrayBuffer());
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: enc.slice(0, 12)}, k, enc.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById('fl').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Abriendo…';
  try {
    const raw = await llave(document.getElementById('pw').value);
    CFG = await abrir(raw);
    if (document.getElementById('rec').checked) LSset('tab_k', ub64(raw));
    iniciar();
  } catch (x) { err.textContent = 'La clave no es correcta.'; }
};
(async () => { const k = LS('tab_k'); if (!k) return; try { CFG = await abrir(b64(k)); iniciar(); } catch (e) { LSset('tab_k', null); } })();

/* ---------- datos vivos ---------- */
const VER = 'Listo para verificar', RES = 'Resuelto', DIA = 864e5;
const ES_MIO = q => /marcelo elvira|^prueba/i.test(q || '');   // lo que cargan el admin y el usuario «prueba» no cuenta como pendiente
const hace = ts => { const d = Math.floor((Date.now() - ts) / DIA); return d <= 0 ? 'hoy' : d === 1 ? 'hace 1 día' : `hace ${d} días`; };
function aFecha(f) { const [d, m, a] = String(f || '').split('/'); return a ? +new Date(+a, m - 1, +d, 12) : 0; }
function desdeEstado(r) {           // por si el script todavía no tiene la versión nueva
  const seg = [], ord = [];
  Object.entries(r.seguimiento || {}).forEach(([mes, pts]) => Object.entries(pts).forEach(([n, l]) => l.forEach((s, i) =>
    seg.push({id: `s|${mes}|${n}|${i}`, ts: aFecha(s.fecha), hora: s.fecha, mes, punto: n, estado: s.estado, quien: s.quien, texto: s.texto, fotos: (s.fotos || []).length}))));
  (r.ordenes || []).forEach(o => ord.push({...o, id: `o|${o.numero}|${o.fecha}`, ts: aFecha(o.fecha), hora: o.fecha}));
  return {seg, ord, marcas: {}, viejo: true};
}
function analizar(p, d) {
  const mesP = {}; p.meses.forEach(m => mesP[m.clave] = m);
  const M = d.marcas || {}, marca = id => (M[id] || {}).marca || '';
  const info = (mes, n) => (mesP[mes].puntos[n] || ['(punto ' + n + ')', '', '', '']);
  const verificar = [], avances = [], ots = [], porMes = {}, ultimo = {}; let ult = 0;
  d.seg.forEach(s => {
    if (!mesP[s.mes]) return;                                   // meses de prueba u otros
    if (s.ts > ult) ult = s.ts;
    const k = s.mes + '|' + s.punto; ultimo[k] = s;
    if (s.estado !== VER && s.estado !== RES && !ES_MIO(s.quien))
      avances.push({tipo: 'av', id: s.id, s, info: info(s.mes, s.punto), m: marca(s.id), mh: (M[s.id] || {}).hora});
  });
  Object.values(ultimo).forEach(s => {
    (porMes[s.mes] = porMes[s.mes] || {})[s.punto] = s.estado;
    if (s.estado === VER) verificar.push({tipo: 'ver', id: s.id, s, info: info(s.mes, s.punto), m: marca(s.id) === 'trabajado' ? 'visto' : marca(s.id), mh: (M[s.id] || {}).hora});
  });
  d.ord.forEach(o => {
    if (o.ts > ult) ult = o.ts;
    if (!o.borrada && !ES_MIO(o.quien)) ots.push({tipo: 'ot', id: o.id, o, m: marca(o.id), mh: (M[o.id] || {}).hora});
  });
  const t = i => (i.s || i.o).ts; [verificar, avances, ots].forEach(l => l.sort((a, b) => t(b) - t(a)));
  return {verificar, avances, ots, porMes, ultima: ult, total_ot: d.ord.filter(o => !o.borrada).length, viejo: !!d.viejo};
}
const pend = l => l.filter(i => i.m !== 'trabajado');
async function leer(p) {
  const q = `token=${encodeURIComponent(p.token)}&lic=${encodeURIComponent(p.lic || '')}`;
  try {
    let r = await (await fetch(`${p.api}?accion=tablero&${q}`, {cache: 'no-store'})).json();
    if (!r.ok) { r = await (await fetch(`${p.api}?accion=estado&${q}`, {cache: 'no-store'})).json(); if (!r.ok) throw 0; r = desdeEstado(r); }
    VIVO[p.id] = {d: r, a: analizar(p, r)};
  } catch (e) { VIVO[p.id] = {error: true}; }
}
async function actualizar() {
  document.getElementById('hora').textContent = 'Actualizando…';
  CFG.portales.forEach(p => VIVO[p.id] = VIVO[p.id] || {cargando: true});
  pintar();
  await Promise.all([...CFG.portales.map(leer), ...(CFG.capacitaciones || []).map(q => leerCap(q).then(pintarCap))]);
  document.getElementById('hora').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit'});
  pintar();
}
async function enviar(p, cuerpo) {
  const r = await (await fetch(p.api, {method: 'POST', headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({tipo: 'tablero', token: p.token, lic: p.lic || '', ...cuerpo})})).json();
  if (!r.ok) throw r; return r;
}
async function marcar(id, ids, marca) {
  const p = CFG.portales.find(q => q.id === id), x = VIVO[id];
  if (!x || !x.d || x.d.viejo) return;
  ids.forEach(k => x.d.marcas[k] = {marca, hora: 'recién'}); x.a = analizar(p, x.d); pintar();
  try { await enviar(p, {accion: 'marca', ids, marca}); } catch (e) { alertar(id, 'No se pudo guardar la marca. Tocá «Actualizar» y probá de nuevo.'); }
}
function todoVisto(id) {

    const ts = (i.s || i.o).ts, viejo = Date.now() - ts > 7 * DIA;
    const llego = `<div class="llego${viejo ? ' viejo' : ''}">Llegó ${esc((i.s || i.o).hora)} · ${hace(ts)}</div>`;
    const estado = i.m === 'trabajado' ? `<span class="mk tr">✓ Trabajado ${esc(i.mh || '')}</span>` : i.m === 'visto' ? `<span class="mk vi">👁 Visto ${esc(i.mh || '')}</span>` : '<span class="nuevo">NUEVO</span>';
    const b = [];
    if (!a.viejo) {
      if (!i.m) b.push(`<button onclick="marcar('${p.id}',['${i.id}'],'visto')">👁 Visto</button>`);
      if (cl === 'ver') b.push(`<button class="res" onclick="resolver('${p.id}','${esc(i.s.mes)}','${esc(i.s.punto)}',this)">✓ Marcar resuelto</button>`);
      else if (i.m !== 'trabajado') b.push(`<button class="tb" onclick="marcar('${p.id}',['${i.id}'],'trabajado')">✓ Ya lo trabajé</button>`);
      else b.push(`<button onclick="marcar('${p.id}',['${i.id}'],'visto')">↺ Volver a pendiente</button>`);
    }
    const botones = b.length ? `<div class="bts">${b.join('')}</div>` : '';
    if (i.o) { const o = i.o; return `<div class="it"><div class="st" style="background:${col}"></div><div>${llego}
      <div class="l1"><b>${esc(o.numero)}</b><span class="tag" style="background:${col}">${esc(o.area || 'Sin área')}</span>${o.cargo ? `<span>a cargo de ${esc(o.cargo)}</span>` : ''}${estado}</div>
      <div class="lug">Informe ${esc(o.mes)} · puntos ${esc((o.puntos || []).join(', '))}</div>
      ${o.texto ? `<div class="txt">${esc(o.texto)}</div>` : ''}
      <div class="pie">${esc(o.quien)}</div>${botones}</div></div>`; }
    const s = i.s, f = s.fotos || 0;
    const tagc = s.estado === VER ? 'var(--ver)' : 'var(--av)';
    return `<div class="it"><div class="st" style="background:${col}"></div><div>${llego}
      <div class="l1"><b>Punto ${esc(s.punto)}</b><span class="lug">Informe ${esc(s.mes)}</span><span class="tag" style="background:${tagc}">${esc(s.estado)}</span>${estado}</div>
      <div class="tit">${esc(i.info[0])}</div><div class="lug">${esc(i.info[1])}${i.info[2] ? ' · ' + esc(i.info[2]) : ''}</div>
      ${s.texto ? `<div class="txt">${esc(s.texto)}</div>` : ''}
      <div class="pie">${esc(s.quien)}${f ? ` · 📷 ${f} foto${f > 1 ? 's' : ''} (en el portal y en tu mail)` : ''}</div>${botones}</div></div>`;
  }).join('')}${pieL}</div>`;
}
</script>
</body>
</html>
